<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="satquery-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#057a70" />
      <stop offset="35%" stop-color="#088395" />
      <stop offset="70%" stop-color="#0a7ea4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="115" fill="url(#satquery-grad)" />

  <!-- Center Aperture / Earth Observation Radar Ring -->
  <circle cx="256" cy="256" r="54" fill="none" stroke="#ffffff" stroke-width="36" />

  <!-- 8 Symmetrical Sensor Rays -->
  <!-- Top (0°) -->
  <rect x="238" y="98" width="36" height="50" rx="9" fill="#ffffff" />
  <!-- Bottom (180°) -->
  <rect x="238" y="364" width="36" height="50" rx="9" fill="#ffffff" />
  <!-- Left (270°) -->
  <rect x="98" y="238" width="50" height="36" rx="9" fill="#ffffff" />
  <!-- Right (90°) -->
  <rect x="364" y="238" width="50" height="36" rx="9" fill="#ffffff" />

  <!-- Diagonal Rays -->
  <!-- Top-Right (45°) -->
  <rect x="238" y="98" width="36" height="50" rx="9" fill="#ffffff" transform="rotate(45 256 256)" />
  <!-- Bottom-Right (135°) -->
  <rect x="238" y="98" width="36" height="50" rx="9" fill="#ffffff" transform="rotate(135 256 256)" />
  <!-- Bottom-Left (225°) -->
  <rect x="238" y="98" width="36" height="50" rx="9" fill="#ffffff" transform="rotate(225 256 256)" />
  <!-- Top-Left (315°) -->
  <rect x="238" y="98" width="36" height="50" rx="9" fill="#ffffff" transform="rotate(315 256 256)" />
</svg>
